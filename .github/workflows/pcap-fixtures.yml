name: Generate real TLS PCAP fixtures

on:
  push:
    branches: [feat/enterprise-measurement-platform]
    paths:
      - ".github/workflows/pcap-fixtures.yml"
      - "scripts/generate_pcap_fixtures.py"
      - "src/pqtls/pcap.py"
      - "tests/test_pcap_integration.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-and-validate:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --cap-add=NET_RAW --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v4
      - name: Install reproducible capture toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git openssl tcpdump tshark python3 python3-pip python3-venv
      - name: Install project test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Generate real TLS 1.3 captures
        run: .venv/bin/python scripts/generate_pcap_fixtures.py
      - name: Validate real capture fixtures
        run: .venv/bin/pytest -q tests/test_pcap_integration.py
      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-tls13-pcap-fixtures
          path: tests/fixtures/pcap/
          retention-days: 14
          if-no-files-found: error
      - name: Commit verified fixtures to the PR branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/pcap/
          if ! git diff --cached --quiet; then
            git commit -m "Add verified TLS 1.3 PCAP fixtures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
