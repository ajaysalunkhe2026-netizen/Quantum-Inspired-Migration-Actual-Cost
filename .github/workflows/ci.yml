name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,api]"
      - run: pytest --cov=pqtls --cov-report=term-missing
      - run: ruff check .
      - run: black --check .
      - name: Strict mypy
        if: always()
        run: mypy src/pqtls
      - name: Upgrade build tooling for security fixes
        if: always()
        run: python -m pip install --upgrade 'setuptools>=84.1.0'
      - name: Dependency audit
        if: always()
        run: pip-audit --skip-editable
      - name: Generate SBOM
        if: always()
        run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-sbom
          path: sbom.json
          if-no-files-found: error
