[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pqc-migration-cost-lab"
version = "0.1.0"
description = "Evidence-first TLS 1.3 PQC migration measurement"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["typer>=0.12,<1", "pydantic>=2.7,<3", "PyYAML>=6,<7", "rich>=13,<15"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "black>=24", "mypy>=1.10"]

[project.scripts]
pqtls = "pqtls.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pqtls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
