[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pqc-migration-cost-lab"
version = "0.2.0"
description = "Evidence-first TLS 1.3 PQC migration measurement"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36"]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "black>=24",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "cyclonedx-bom>=4",
]

[project.scripts]
pqtls = "pqtls.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pqtls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "I001"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
